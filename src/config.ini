[general]
# 当前启用的翻译平台，可选值: baidu, youdao, google
provider = baidu
# 网络请求超时时间（秒）
timeout = 5

[baidu]
# 百度翻译开放平台通用文本翻译 API (https://fanyi-api.baidu.com/)
appid = 20241220002233664
secret_key = GMH8lkCtGvV7nQC46RYn

[youdao]
# 有道智云文本翻译 API v3 (https://ai.youdao.com/)
app_key = 
