[google]
# 谷歌翻译配置
# api_key 留空则默认使用免费网页接口 (translate.googleapis.com)
# 填写 api_key 则使用 Google Cloud Translation API v2 官方接口
api_key = 
# 可选代理地址，例如: http://127.0.0.1:7890
proxy = 

[llm]
# OpenAI 兼容接口基础地址，例如: https://api.openai.com/v1
base_url = https://api.openai.com/v1
# API 密钥
api_key = 
# 支持视觉理解的多模态模型名称，例如: gpt-4o-mini, qwen-vl-max
model = gpt-4o-mini
# LLM 请求超时时间（秒）
timeout = 15

